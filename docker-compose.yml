services:
  # ── PostgreSQL Database Container ────────────────────────
  db:
    image: postgres:15-alpine
    container_name: campus-complaint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_complaints
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_complaints"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Node.js Express Backend Container (Port 5000) ────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campus-complaint-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/campus_complaints
    volumes:
      # Persistent volume for SQLite / LowDB embedded storage
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # ── React Vite Frontend Container (Port 3000) ────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: campus-complaint-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

# ── Persistent Storage Volumes ─────────────────────────────
volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
